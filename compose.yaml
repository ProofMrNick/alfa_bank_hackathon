name: alfa-bank-hackathon

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /models/Llama-3.2-1B-Instruct-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "2048"
      - --threads
      - "4"
      - --n-gpu-layers
      - "0"
    volumes:
      - ./local-llm/models:/models:ro
    ports:
      - "8081:8080"
    mem_limit: 3g
    restart: unless-stopped

  scoring:
    build:
      context: ./ml
    environment:
      SCORING_ARTIFACTS_DIR: /app/artifacts
      BACKEND_URL: http://backend:5003/api
      ML_PASSWORD: ${ML_PASSWORD:?Set ML_PASSWORD in .env}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: "5003"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ML_PASSWORD: ${ML_PASSWORD:?Set ML_PASSWORD in .env}
      EMPLOYEE_PASSWORD: ${EMPLOYEE_PASSWORD:?Set EMPLOYEE_PASSWORD in .env}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:?Set CLIENT_PASSWORD in .env}
      SCORING_URL: http://scoring:8000
      LLM_BASE_URL: http://llm:8080
      LLM_MODEL: Llama-3.2-1B-Instruct-Q4_K_M
      LLM_TIMEOUT_MS: "30000"
    ports:
      - "5003:5003"
    depends_on:
      llm:
        condition: service_started
      scoring:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5003/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_LOCAL_API_URL: http://localhost:5003
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
